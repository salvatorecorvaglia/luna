appId: com.lunar.app
productName: Lunar
copyright: "Copyright © ${author}"

directories:
  buildResources: resources
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.github,tests,coverage,vitest.config.*}'

asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/ssh2/**'

# ─────────────────── macOS ───────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: '${name}-${version}-mac-${arch}.${ext}'
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false  # Set to true when you have an Apple Developer ID

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ─────────────────── Windows ───────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${name}-${version}-win-${arch}-setup.${ext}'
  # signtoolOptions:
  #   publisherName: Salvatore Corvaglia
  #   signingHashAlgorithms:
  #     - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lunar
  uninstallDisplayName: Lunar

# ─────────────────── Linux ───────────────────
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: '${name}-${version}-linux-${arch}.${ext}'
  category: Development;Utility;Network
  maintainer: Salvatore Corvaglia
  synopsis: A modern SSH terminal and intuitive SFTP file manager built for modern developers
  description: >-
    A high-performance, cross-platform desktop application designed to streamline
    your remote server workflows. Combining a powerful terminal with an intuitive
    dual-pane SFTP browser.
  desktop:
    entry:
      Name: Lunar
      Comment: A modern SSH terminal and intuitive SFTP file manager built for modern developers
      Keywords: ssh;sftp;terminal;file-manager;remote

appImage:
  license: LICENSE

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libuuid1

# ─────────────────── Auto-update ───────────────────
publish:
  provider: github
  owner: salvatorecorvaglia
  repo: lunar
  releaseType: release

# Generate latest.yml / latest-mac.yml / latest-linux.yml
generateUpdatesFilesForAllChannels: false