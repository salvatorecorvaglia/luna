name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────
  # Quality Gate – run before building any artifact
  # ──────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-checking
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

  # ──────────────────────────────────────────────
  # Build & Publish – macOS
  # ──────────────────────────────────────────────
  release-mac:
    name: Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build & Publish – Windows
  # ──────────────────────────────────────────────
  release-win:
    name: Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build & Publish – Linux
  # ──────────────────────────────────────────────
  release-linux:
    name: Release (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Finalize – update release description and docs
  # ──────────────────────────────────────────────
  finalize:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [release-mac, release-win, release-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          fetch-depth: 0

      - name: Extract Release Notes
        id: extract_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=$(sed -e "1,/## \[$VERSION\]/d" -e '/## \[/,$d' CHANGELOG.md)
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract_notes.outputs.notes }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release edit "$TAG" \
            --draft=false \
            --title "Lunar $VERSION" \
            --notes "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY"

      - name: Update Landing Page Version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Checkout main branch to apply and push changes
          git fetch origin main
          git checkout main
          
          # Update the version in the central config file
          sed -i "s/version: '[0-9]\+\.[0-9]\+\.[0-9]\+'/version: '$VERSION'/g" docs/config.js
          
          git add docs/config.js
          
          # Only commit and push if there are actual changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update landing page to $TAG"
            git push origin main
          else
            echo "No changes detected for the landing page. Skipping commit."
          fi
