name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ──────────────────────────────────────────────
  # Validate Tag Ref
  # ──────────────────────────────────────────────
  validate:
    name: Validate Tag Ref
    runs-on: ubuntu-latest
    steps:
      - name: Check if tag ref
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Release workflow must be run on a tag ref (e.g. refs/tags/v1.0.0)"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Quality Gate – run before building any artifact
  # ──────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm run lint

      - name: Run TypeScript type-checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:coverage

  # ──────────────────────────────────────────────
  # Build & Publish – macOS
  # ──────────────────────────────────────────────
  release-mac:
    name: Release (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Electron Binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build & Publish – Windows
  # ──────────────────────────────────────────────
  release-win:
    name: Release (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Electron Binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Build & Publish – Linux
  # ──────────────────────────────────────────────
  release-linux:
    name: Release (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Electron Binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Finalize – update release description and docs
  # ──────────────────────────────────────────────
  finalize:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [release-mac, release-win, release-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        id: extract_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES=$(sed -e "1,/## \[$VERSION\]/d" -e '/## \[/,$d' CHANGELOG.md)
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.extract_notes.outputs.notes }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release edit "$TAG" \
            --draft=false \
            --title "Lunar v$VERSION" \
            --notes "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY"

