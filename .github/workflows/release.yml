name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # ──────────────────────────────────────────────
  # Validate Tag Ref
  # ──────────────────────────────────────────────
  validate:
    name: Validate Tag Ref
    runs-on: ubuntu-latest
    steps:
      - name: Check if tag ref
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "Workflow dispatched with tag input: $TAG"
          elif [[ "${{ github.event_name }}" != "workflow_dispatch" && "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Release workflow must be run on a tag ref (e.g. refs/tags/v1.0.0) or triggered with a tag input"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Quality Gate – run before building any artifact
  # ──────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Fix node-gyp permissions
        shell: bash
        run: find /Users/runner /home/runner ~/.pnpm-store -name "gyp_main.py" -exec chmod +x {} + 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm run lint

      - name: Run TypeScript type-checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test:coverage

  # ──────────────────────────────────────────────
  # Build & Publish – Multi-Platform Matrix
  # ──────────────────────────────────────────────
  release:
    name: Release (${{ matrix.platform-name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            platform-name: macOS
            artifact-name: release-mac
            path: |
              dist/*.dmg
              dist/*.zip
              dist/*.yml
          - os: windows-latest
            platform: win
            platform-name: Windows
            artifact-name: release-win
            path: |
              dist/*.exe
              dist/*.yml
          - os: ubuntu-latest
            platform: linux
            platform-name: Linux
            artifact-name: release-linux
            path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache Electron Binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Fix node-gyp permissions
        shell: bash
        run: find /Users/runner /home/runner ~/.pnpm-store -name "gyp_main.py" -exec chmod +x {} + 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.path }}
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Finalize – update release description and docs
  # ──────────────────────────────────────────────
  finalize:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        id: extract_notes
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(sed -e "1,/## \[$VERSION\]/d" -e '/## \[/,$d' CHANGELOG.md || true)
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.extract_notes.outputs.tag }}
          VERSION: ${{ steps.extract_notes.outputs.version }}
          RELEASE_NOTES: ${{ steps.extract_notes.outputs.notes }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --title "Luna v$VERSION" \
              --notes "$RELEASE_NOTES" \
              --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" \
              --title "Luna v$VERSION" \
              --notes "$RELEASE_NOTES" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" \
              --draft=false \
              --title "Luna v$VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" \
              --title "Luna v$VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

