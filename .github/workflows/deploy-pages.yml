name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check pending release
        id: check_release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "pending=false" >> $GITHUB_OUTPUT
          else
            echo "pending=true" >> $GITHUB_OUTPUT
            echo "Skipping deployment because release for $VERSION is pending."
          fi
      - name: Setup Pages
        if: steps.check_release.outputs.pending == 'false'
        uses: actions/configure-pages@v5
      - name: Inject Version
        if: steps.check_release.outputs.pending == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/__LUNAR_VERSION__/$VERSION/g" docs/config.js
      - name: Upload artifact
        if: steps.check_release.outputs.pending == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        if: steps.check_release.outputs.pending == 'false'
        id: deployment
        uses: actions/deploy-pages@v4
