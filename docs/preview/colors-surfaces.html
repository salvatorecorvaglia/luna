<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Surfaces</title>
<link rel="stylesheet" href="_card.css"/></head>
<body><div class="card">
  <div class="eyebrow">Surfaces &amp; foreground</div>
  <div class="swatch-grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch" style="background: hsl(240 10% 3.9%);">background<br/><span style="opacity:.6">240 10% 3.9%</span></div>
    <div class="swatch" style="background: hsl(240 6% 6%);">card<br/><span style="opacity:.6">240 6% 6%</span></div>
    <div class="swatch" style="background: hsl(240 3.7% 15.9%);">muted / border<br/><span style="opacity:.6">240 3.7% 15.9%</span></div>
    <div class="swatch" style="background: hsl(0 0% 98%); color:#111;">foreground<br/><span style="opacity:.7">0 0% 98%</span></div>
  </div>
  <div class="row" style="gap:24px; margin-top:6px;">
    <div class="col"><div class="label">muted-fg</div><div style="width:48px;height:24px;border-radius:4px;background:hsl(240 5% 64.9%)"></div></div>
    <div class="col"><div class="label">ring</div><div style="width:48px;height:24px;border-radius:4px;background:hsl(240 4.9% 83.9%)"></div></div>
    <div class="col"><div class="label">primary</div><div style="width:48px;height:24px;border-radius:4px;background:hsl(0 0% 98%)"></div></div>
  </div>
</div></body></html>
