<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Buttons</title>
<link rel="stylesheet" href="_card.css"/></head>
<body><div class="card">
  <div class="eyebrow">Buttons</div>
  <div class="row" style="gap:10px;flex-wrap:wrap;">
    <button style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:hsl(0 0% 98%);color:hsl(240 5.9% 10%);border:none;font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;">Primary</button>
    <button style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:transparent;color:var(--color-muted-foreground);border:none;font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;">Ghost</button>
    <button style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--color-background);color:var(--color-muted-foreground);border:1px solid var(--color-border);font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;">Outline</button>
    <button style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:hsl(0 62.8% 30.6%);color:hsl(0 0% 98%);border:none;font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;">Destructive</button>
  </div>
  <div class="row" style="gap:10px;">
    <button style="width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid var(--color-border);color:var(--color-muted-foreground);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <span class="label">icon button · 32px · scale(0.92) on press</span>
  </div>
</div></body></html>
