<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal themes</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Terminal themes</div>
      <div class="swatch-grid" style="grid-template-columns: repeat(3, 1fr); gap: 10px">
        <div
          style="background: #282a36; border-radius: 6px; padding: 10px; border: 1px solid #21222c"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #f8f8f2;
              margin-bottom: 6px;
            "
          >
            Dracula
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #bd93f9; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #ff79c6; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #50fa7b; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #8be9fd; border-radius: 3px"
            ></span>
          </div>
        </div>
        <div
          style="background: #1a1b26; border-radius: 6px; padding: 10px; border: 1px solid #15161e"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #a9b1d6;
              margin-bottom: 6px;
            "
          >
            Tokyo Night
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #7aa2f7; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #bb9af7; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #9ece6a; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #7dcfff; border-radius: 3px"
            ></span>
          </div>
        </div>
        <div
          style="background: #2e3440; border-radius: 6px; padding: 10px; border: 1px solid #3b4252"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #d8dee9;
              margin-bottom: 6px;
            "
          >
            Nord
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #88c0d0; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #81a1c1; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #a3be8c; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #b48ead; border-radius: 3px"
            ></span>
          </div>
        </div>
        <div
          style="background: #282828; border-radius: 6px; padding: 10px; border: 1px solid #3a3a3a"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #ebdbb2;
              margin-bottom: 6px;
            "
          >
            Gruvbox
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #fabd2f; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #fb4934; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #b8bb26; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #83a598; border-radius: 3px"
            ></span>
          </div>
        </div>
        <div
          style="background: #272822; border-radius: 6px; padding: 10px; border: 1px solid #3a3a32"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #f8f8f2;
              margin-bottom: 6px;
            "
          >
            Monokai
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #a6e22e; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #f92672; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #66d9ef; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #ae81ff; border-radius: 3px"
            ></span>
          </div>
        </div>
        <div
          style="background: #282c34; border-radius: 6px; padding: 10px; border: 1px solid #3a3f4b"
        >
          <div
            style="
              font-family: var(--font-mono);
              font-size: 11px;
              color: #abb2bf;
              margin-bottom: 6px;
            "
          >
            One Dark
          </div>
          <div style="display: flex; gap: 4px">
            <span style="width: 14px; height: 14px; background: #61afef; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #c678dd; border-radius: 3px"></span
            ><span style="width: 14px; height: 14px; background: #98c379; border-radius: 3px"></span
            ><span
              style="width: 14px; height: 14px; background: #e06c75; border-radius: 3px"
            ></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
