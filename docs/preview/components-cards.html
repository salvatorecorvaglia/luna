<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Cards</title>
<link rel="stylesheet" href="_card.css"/></head>
<body><div class="card">
  <div class="eyebrow">Action card</div>
  <div style="display:flex;align-items:center;gap:14px;border:1px solid hsl(240 3.7% 15.9% / 0.8);background:hsl(240 6% 6% / 0.8);border-radius:12px;padding:16px;">
    <div style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:rgb(59 130 246 / 0.1);flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:14px;font-weight:500;color:var(--color-foreground);">New Connection</div>
      <div style="font-size:12px;color:var(--color-muted-foreground);">Set up an SSH connection to a server</div>
    </div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(240 5% 64.9% / 0.5)" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </div>
  <div style="display:flex;align-items:center;gap:14px;border:1px solid hsl(240 3.7% 15.9% / 0.8);background:hsl(240 6% 6% / 0.8);border-radius:12px;padding:16px;">
    <div style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:rgb(139 92 246 / 0.1);flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:500;color:var(--color-foreground);">SFTP Browser</div>
      <div style="font-size:12px;color:var(--color-muted-foreground);">Browse and transfer files over SSH</div>
    </div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="hsl(240 5% 64.9% / 0.5)" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </div>
</div></body></html>
