<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Brand gradient</title>
<link rel="stylesheet" href="_card.css"/></head>
<body><div class="card">
  <div class="eyebrow">Brand gradient</div>
  <div style="height:120px;border-radius:var(--radius-lg);background:linear-gradient(135deg,#38bdf8 0%,#6366f1 50%,#8b5cf6 100%);display:flex;align-items:flex-end;padding:14px;">
    <span style="font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,0.95)">linear-gradient(135deg, #38bdf8 → #6366f1 → #8b5cf6)</span>
  </div>
  <div class="row" style="gap:10px;">
    <div class="col" style="flex:1;"><div style="height:32px;background:#38bdf8;border-radius:6px;"></div><div class="label">cyan · #38bdf8</div></div>
    <div class="col" style="flex:1;"><div style="height:32px;background:#6366f1;border-radius:6px;"></div><div class="label">indigo · #6366f1</div></div>
    <div class="col" style="flex:1;"><div style="height:32px;background:#8b5cf6;border-radius:6px;"></div><div class="label">violet · #8b5cf6</div></div>
  </div>
</div></body></html>
