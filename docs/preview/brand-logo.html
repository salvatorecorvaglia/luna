<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logo</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card" style="flex-direction: row; align-items: center; gap: 32px">
      <img
        src="../assets/lunar-logo.png"
        alt="Lunar"
        style="
          width: 140px;
          height: 140px;
          object-fit: contain;
          filter: drop-shadow(0 8px 24px rgb(99 102 241 / 0.4));
        "
      />
      <div class="col" style="gap: 6px">
        <div style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Lunar</div>
        <div style="font-size: 14px; color: var(--color-muted-foreground); max-width: 380px">
          Crescent moon embracing a <code style="color: #7dcfff">&gt;_</code> terminal prompt. Cyan
          → indigo → violet brand gradient.
        </div>
        <div class="label" style="margin-top: 6px">
          assets/lunar-logo.png · drop-shadow on dark surfaces
        </div>
      </div>
    </div>
  </body>
</html>
