<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Semantic colors</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Semantic colors</div>
      <div class="swatch-grid" style="grid-template-columns: repeat(4, 1fr)">
        <div class="swatch" style="background: hsl(142 71% 45%)">
          success<br /><span style="opacity: 0.7">142 71% 45%</span>
        </div>
        <div class="swatch" style="background: hsl(38 92% 50%); color: #111">
          warning<br /><span style="opacity: 0.7">38 92% 50%</span>
        </div>
        <div class="swatch" style="background: hsl(0 62.8% 30.6%)">
          destructive<br /><span style="opacity: 0.7">0 62.8% 30.6%</span>
        </div>
        <div class="swatch" style="background: hsl(217 91% 60%)">
          info<br /><span style="opacity: 0.7">217 91% 60%</span>
        </div>
      </div>
    </div>
  </body>
</html>
