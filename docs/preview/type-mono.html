<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Type — Mono</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Mono · JetBrains Mono</div>
      <div
        style="
          background: #1a1b26;
          border-radius: 8px;
          padding: 14px 16px;
          font-family: var(--font-mono);
          font-size: 13px;
          line-height: 1.55;
          color: #a9b1d6;
          border: 1px solid #15161e;
        "
      >
        <span style="color: #9ece6a">user@lunar</span><span style="color: #7aa2f7">:</span
        ><span style="color: #bb9af7">~/projects</span><span style="color: #a9b1d6">$</span> ssh
        deploy@prod.example.com<br />
        <span style="color: #7dcfff">deploy@prod</span>:~$ tail -f /var/log/app.log<br />
        <span style="color: #e0af68">[2026-05-05 14:22:01]</span> request_id=<span
          style="color: #9ece6a"
          >"a4f9c"</span
        >
        status=<span style="color: #f7768e">200</span>
      </div>
      <div class="row" style="gap: 8px">
        <kbd>⌘</kbd><kbd>K</kbd><span class="label">to open the command palette</span>
      </div>
    </div>
  </body>
</html>
