<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Radii</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Radii</div>
      <div class="row" style="gap: 14px">
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 4px;
            "
          ></div>
          <div class="label">sm · 4</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 6px;
            "
          ></div>
          <div class="label">md · 6</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
            "
          ></div>
          <div class="label">lg · 8</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 12px;
            "
          ></div>
          <div class="label">xl · 12</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 16px;
            "
          ></div>
          <div class="label">2xl · 16</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 60px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 9999px;
            "
          ></div>
          <div class="label">full</div>
        </div>
      </div>
    </div>
  </body>
</html>
