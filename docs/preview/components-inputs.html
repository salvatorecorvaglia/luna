<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inputs</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Form inputs</div>
      <input
        placeholder="user@host.example.com"
        style="
          width: 100%;
          border-radius: 6px;
          border: 1.5px solid var(--color-border);
          background: var(--color-background);
          padding: 8px 12px;
          font-size: 13px;
          color: var(--color-foreground);
          font-family: var(--font-sans);
          outline: none;
        "
      />
      <input
        placeholder="port: 22"
        style="
          width: 100%;
          border-radius: 6px;
          border: 1.5px solid #6366f1;
          background: var(--color-background);
          padding: 8px 12px;
          font-size: 13px;
          color: var(--color-foreground);
          font-family: var(--font-sans);
          outline: none;
          box-shadow: 0 0 0 3px rgb(99 102 241 / 0.12);
        "
      />
      <input
        placeholder="disabled field"
        disabled
        style="
          width: 100%;
          border-radius: 6px;
          border: 1.5px solid var(--color-border);
          background: var(--color-background);
          padding: 8px 12px;
          font-size: 13px;
          color: var(--color-foreground);
          font-family: var(--font-sans);
          outline: none;
          opacity: 0.5;
        "
      />
      <div class="label">default · focus (indigo ring) · disabled</div>
    </div>
  </body>
</html>
