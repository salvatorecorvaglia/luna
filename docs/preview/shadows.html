<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadows</title>
    <link rel="stylesheet" href="_card.css" />
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Elevation</div>
      <div class="row" style="gap: 18px; flex-wrap: wrap">
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.15);
            "
          ></div>
          <div class="label">xs</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow:
                0 1px 3px 0 rgb(0 0 0 / 0.2),
                0 1px 2px -1px rgb(0 0 0 / 0.15);
            "
          ></div>
          <div class="label">sm</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow:
                0 4px 6px -1px rgb(0 0 0 / 0.25),
                0 2px 4px -2px rgb(0 0 0 / 0.15);
            "
          ></div>
          <div class="label">md</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow:
                0 10px 15px -3px rgb(0 0 0 / 0.3),
                0 4px 6px -4px rgb(0 0 0 / 0.2);
            "
          ></div>
          <div class="label">lg</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow:
                0 20px 25px -5px rgb(0 0 0 / 0.35),
                0 8px 10px -6px rgb(0 0 0 / 0.2);
            "
          ></div>
          <div class="label">xl</div>
        </div>
        <div class="col" style="align-items: center">
          <div
            style="
              width: 88px;
              height: 60px;
              background: var(--color-card);
              border: 1px solid var(--color-border);
              border-radius: 8px;
              box-shadow: 0 0 24px rgb(99 102 241 / 0.45);
            "
          ></div>
          <div class="label">glow</div>
        </div>
      </div>
    </div>
  </body>
</html>
