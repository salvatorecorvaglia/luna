packages:
  - '.'

overrides:
  esbuild: '0.28.1'
  # Security: transitive deps of electron-builder pinned to patched releases.
  # fast-uri <3.1.9 - URI normalization / scheme injection advisories
  # @xmldom/xmldom <0.8.15 - XML fragment injection
  fast-uri: '^3.1.9'
  '@xmldom/xmldom': '^0.8.15'
  'brace-expansion@^1.1.0': '^1.1.21'
  'brace-expansion@^2.0.0': '^2.1.7'
  'brace-expansion@^5.0.0': '^5.0.12'
  http-cache-semantics: '^4.3.0'
  # undici <6.29.1 - content-encoding / EventSource denial of service
  'undici@^6.0.0': '^6.29.1'
  # global-agent 4 removes roarr/sprintf-js (no patched sprintf-js release).
  '@electron/get>global-agent': '^4.1.3'

allowBuilds:
  cpu-features: true
  node-pty: true
  better-sqlite3: true
  esbuild: true
  electron: true
  electron-winstaller: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1140.0 || 3.1152.0'
  - '@aws-sdk/lib-storage@3.1140.0 || 3.1152.0'
  - '@aws-sdk/s3-request-presigner@3.1140.0 || 3.1152.0'
  - vite@8.3.1 || 8.3.5
  - '@vitest/coverage-v8@5.0.2'
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
  - framer-motion@13.4.3 || 14.4.0
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - electron-vite@6.0.0
  - '@asamuzakjp/dom-selector@10.0.3'
  - jsdom@30.1.3
  - react@19.3.1
  - react-dom@19.3.1
  - motion-dom@14.4.0
  - '@biomejs/biome@2.6.4'
  - '@biomejs/cli-android-arm64@2.6.4'
  - '@biomejs/cli-android-x64@2.6.4'
  - '@biomejs/cli-darwin-arm64@2.6.4'
  - '@biomejs/cli-darwin-x64@2.6.4'
  - '@biomejs/cli-linux-arm64-musl@2.6.4'
  - '@biomejs/cli-linux-arm64@2.6.4'
  - '@biomejs/cli-linux-x64-musl@2.6.4'
  - '@biomejs/cli-linux-x64@2.6.4'
  - '@biomejs/cli-win32-arm64@2.6.4'
  - '@biomejs/cli-win32-x64@2.6.4'
