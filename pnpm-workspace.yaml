packages:
  - '.'

overrides:
  esbuild: "0.28.1"
  # Security: transitive deps of electron-builder pinned to patched releases.
  # fast-uri <3.1.6 - SSRF / host confusion (GHSA, 4 advisories)
  # @xmldom/xmldom <0.8.15 - XML fragment injection
  fast-uri: "^3.1.6"
  "@xmldom/xmldom": "^0.8.15"

allowBuilds:
  cpu-features: true
  node-pty: true
  better-sqlite3: true
  esbuild: true
  electron: true
  electron-winstaller: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1140.0 || 3.1152.0'
  - '@aws-sdk/lib-storage@3.1140.0 || 3.1152.0'
  - '@aws-sdk/s3-request-presigner@3.1140.0 || 3.1152.0'
  - vite@8.3.1
  - '@vitest/coverage-v8@5.0.2'
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
  - framer-motion@13.4.3
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - electron-vite@6.0.0
  - '@asamuzakjp/dom-selector@10.0.3'
  - jsdom@30.1.3
  - react@19.3.1
  - react-dom@19.3.1
